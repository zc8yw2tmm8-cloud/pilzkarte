name: Wetterdaten sammeln

# Viermal taeglich, jeweils kurz nach den ICON-D2-Laeufen des DWD.
# Der Vortag wird nur beim ersten Lauf geholt - er aendert sich nicht
# mehr. Die Vorhersage dagegen jedes Mal: sie wird alle drei Stunden
# neu gerechnet, und ein Regengebiet kann anders ziehen als gedacht.
#
# Krumme Minuten, weil GitHub geplante Laeufe zur vollen Stunde
# haeufiger verschiebt oder ausfallen laesst.
on:
  schedule:
    - cron: "17 4 * * *"     # 6:17 Sommerzeit
    - cron: "17 10 * * *"    # 12:17
    - cron: "17 14 * * *"    # 16:17
    - cron: "17 18 * * *"    # 20:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taeglich
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      # Nur im Fruehlauf. Spaeter am Tag ist der Vortag laengst da,
      # und das Skript wuerde ohnehin "nichts zu tun" melden.
      - name: Vortag sammeln
        if: >
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '17 4 * * *'
        run: python sammeln.py

      # Bei jedem Lauf - das ist der Grund fuer die vier Termine
      - name: Vorhersage holen
        run: python prognose.py

      # Fehlende Tage nachholen, falls ein Lauf ausgefallen ist.
      # Nur sonntags frueh, weil es rund 1000 Abrufe kostet.
      - name: Luecken schliessen
        if: github.event.schedule == '17 4 * * *'
        run: |
          if [ "$(date +%u)" = "7" ]; then
            python nachfuellen.py
          else
            echo "Nur sonntags - heute uebersprungen"
          fi

      - name: Ergebnisse zurueckschreiben
        run: |
          git config user.name "Pilzkarte"
          git config user.email "actions@github.com"

          # Erst die eigenen Ergebnisse beiseitelegen, dann sauber auf
          # den Serverstand zuruecksetzen, dann wieder auflegen. Ohne
          # Verschmelzen - eine Mischung aus alter und neuer Vorhersage
          # waere sinnlos.
          git stash push -- wetter_historie/ wetter_prognose.csv || true
          git fetch origin main
          git reset --hard origin/main
          git stash pop || git checkout --theirs . || true

          git add wetter_historie/ wetter_prognose.csv
          if git diff --staged --quiet; then
            echo "Nichts geaendert"
          else
            git commit -m "Wetterdaten $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi