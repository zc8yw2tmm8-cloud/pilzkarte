name: Wetterdaten sammeln

# Jeden Morgen um 6 Uhr UTC, also 8 Uhr im Sommer und 7 Uhr im Winter.
# GitHub kann geplante Laeufe um bis zu 15 Minuten verschieben oder bei
# hoher Last auslassen - fuer Tageswerte ist das unerheblich, weil das
# Skript beim naechsten Lauf nachholt.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taeglich
  cancel-in-progress: false

env:
  # Sonst puffert Python die Ausgabe und man sieht bei einem
  # abgebrochenen Lauf ueberhaupt nichts.
  PYTHONUNBUFFERED: "1"

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Vortag sammeln
        run: python sammeln.py

      - name: Vorhersage holen
        run: python prognose.py

      # Fehlende Tage nachholen, falls ein Lauf ausgefallen ist.
      # Nur sonntags, weil es rund 1000 Abrufe kostet.
      - name: Luecken schliessen
        if: github.event.schedule == '0 6 * * *'
        run: |
          if [ "$(date +%u)" = "7" ]; then
            python nachfuellen.py
          else
            echo "Nur sonntags - heute uebersprungen"
          fi

      - name: Ergebnisse zurueckschreiben
        run: |
          git config user.name "Pilzkarte"
          git config user.email "actions@github.com"

          # Erst die eigenen Ergebnisse beiseitelegen, dann sauber auf
          # den Serverstand zuruecksetzen, dann wieder auflegen. Ohne
          # Verschmelzen - eine Mischung aus alter und neuer Vorhersage
          # waere sinnlos.
          git stash push -- wetter_historie/ wetter_prognose.csv || true
          git fetch origin main
          git reset --hard origin/main
          git stash pop || git checkout --theirs . || true

          git add wetter_historie/ wetter_prognose.csv
          if git diff --staged --quiet; then
            echo "Nichts geaendert"
          else
            git commit -m "Wetterdaten $(date +%Y-%m-%d)"
            git push
          fi
