name: Seite bauen

# Nach JEDEM Sammellauf neu bauen, nicht nur einmal taeglich.
#
# taeglich.yml holt viermal am Tag die Vorhersage. Ohne diese
# Verkettung stuenden die neuen Wetterdaten zwar im Repository, die
# Karte zeigte aber weiter den Stand vom Morgen.
on:
  workflow_run:
    workflows: ["Wetterdaten sammeln"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nicht zwei Bauvorgaenge gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    # Nur wenn das Sammeln geklappt hat - sonst wuerde die Karte mit
    # halben Daten neu gebaut
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Projekt holen
        uses: actions/checkout@v4
        with:
          # Den Stand nehmen, den das Sammeln geschrieben hat
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Daten erzeugen
        run: |
          python daten_export.py
          python web_bilder.py

      - name: Seiten vorbereiten
        uses: actions/configure-pages@v5

      - name: Hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}