<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,
      viewport-fit=cover">
<meta name="description" content="Karte der Fundwahrscheinlichkeit für
      Speisepilze in der Region Braunschweig, Wolfsburg und südliche
      Lüneburger Heide.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="konto.css">
<meta name="theme-color" content="#15181c">
<title>Pilzkarte</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --grund: #15181c; --flaeche: #1e2228; --text: #e6e6e6;
    --leise: #9aa0a6; --linie: #2f353d; --akzent: #5fb763;
    --warn: #e8a33d;
  }
  /* Helle Ansicht - dieselben Bausteine, andere Werte. */
  html.hell-start body, body.hell {
    --grund: #f4f2ee; --flaeche: #ffffff; --text: #1c1f22;
    --leise: #5f6469; --linie: #d9d5cd; --akzent: #2f7a35;
    --warn: #b4761e;
  }
  body.hell .fuss { background: rgba(255,255,255,.85); }
  body.hell .stand { background: rgba(255,255,255,.8); }
  /* Der Navigationsknopf war auch in der hellen Ansicht fast
     schwarz auf dunkel - unlesbar. */
  body.hell .navi:not(.eintrag) { background: #eceae4;
                                  color: #1c1f22;
                                  border-color: #c9c4b8; }
  body.hell .navi:not(.eintrag):hover { border-color: #8a8578; }
  body.hell .maplibregl-popup-tip {
    border-top-color: #ffffff !important;
    border-bottom-color: #ffffff !important; }


  /* ===== Schwebende Bedienung ===== */

  header { position: absolute; inset: 0; z-index: 5;
           pointer-events: none; padding: 10px; }
  /* Nur die Elemente selbst nehmen Tipps an, nicht der ganze
     Bereich - sonst waere die Karte darunter nicht bedienbar. */
  header > * { pointer-events: auto; }

  /* Die alten Bedienelemente sind noch im HTML, weil ihr Code sie
     braucht - sie duerfen aber nicht mehr erscheinen. Ohne diese
     Zeile gewinnt ihr display:flex gegen das hidden-Merkmal, und
     alles liegt uebereinander. */
  header [hidden], header [hidden] * { display: none !important; }

  /* Der Einstellungsblock gehoert nach unten links, nicht in die
     Mitte des Bildes. Er wandert in Schritt 3 ins Ebenenblatt. */
  /* Einstellungen: am Rechner eine Spalte links, auf dem Telefon
     ein Blatt von unten.
     Am Rechner ist links Platz, den man nicht verschenken sollte -
     dort steht der Block offen da und laesst sich einklappen. Auf
     dem Telefon waere er im Weg, deshalb erscheint er erst auf
     Druck und dann von unten, wo der Daumen ist. */
  #einstellungen { position: absolute; left: 10px; top: 106px;
                   width: min(360px, 32vw);
                   max-height: calc(100vh - 200px);
                   overflow-y: auto;
                   background: rgba(30,34,40,.94);
                   border: 1px solid var(--linie);
                   border-radius: 12px; padding: 12px 14px 14px; }

  /* Die Knoepfe brechen um, statt seitlich zu verschwinden.
     Vorher war die Leiste scrollbar - am Rechner sieht man dann
     nicht, dass es weitergeht, und findet Eiche oder Fichte nie. */
  #einstellungen .tagleiste { flex-wrap: wrap; overflow: visible; }
  #einstellungen .zeile { display: block; }
  #einstellungen .zeile > .marke { display: block; margin-bottom: 5px;
                                   flex: none; }
  #einstellungen .regler .marke { flex: 0 0 62px; }

  .blockkopf { display: flex; align-items: center; gap: 8px;
               margin-bottom: 10px; padding-bottom: 8px;
               border-bottom: 1px solid var(--linie);
               font-size: 12px; color: var(--leise);
               text-transform: uppercase; letter-spacing: .05em; }
  .blockkopf button { margin-left: auto; background: transparent;
                      border: 0; color: var(--leise); font-size: 20px;
                      line-height: 1; cursor: pointer; padding: 0 4px; }
  .blockkopf button:hover { color: var(--akzent); }
  /* Im Blatt hat die Ueberschrift schon einen Titel */
  .blatt-inhalt .blockkopf { display: none; }
  #einstellungen.zu { display: none; }
  #einstellungen .zeile { margin-top: 6px; }
  #einstellungen .regler { margin-top: 0; }
  body.hell #einstellungen { background: rgba(255,255,255,.95); }

  /* Im Blatt braucht er keine eigene Umrandung */
  .blatt-inhalt #einstellungen { position: static; width: auto;
                                 max-height: none; background: none;
                                 border: 0; padding: 0; }

  /* Pille und Tageschips gelten fuer beide Ansichten - in der
     Bestenliste will man ebenso die Art wechseln und durch die
     Tage blaettern. Deshalb liegen sie ueber der Liste. */
  .pille { position: absolute; top: 10px; left: 50%; z-index: 7;
           transform: translateX(-50%);
           width: min(520px, calc(100vw - 20px));
           display: flex; align-items: center; gap: 9px;
           background: rgba(30,34,40,.94);
           border: 1px solid var(--linie); border-radius: 22px;
           padding: 10px 15px; cursor: pointer;
           backdrop-filter: blur(6px); max-width: 520px; }
  .pille b { font-size: 14.5px; }
  .pille .wert { color: var(--akzent); font-weight: 700;
                 font-size: 16px; }
  .pille .pfeil { margin-left: auto; color: var(--leise);
                  font-size: 12px; }
  .pille:hover { border-color: var(--akzent); }
  .pille, .tagchips { max-width: none; }

  .tagchips { position: absolute; top: 60px; left: 50%; z-index: 7;
              transform: translateX(-50%);
              width: min(520px, calc(100vw - 20px));
              display: flex; gap: 6px; overflow-x: auto;
              scrollbar-width: none; padding-bottom: 2px;
              max-width: 520px; }
  .tagchips::-webkit-scrollbar { display: none; }
  .tagchips button { flex: 0 0 auto; background: rgba(30,34,40,.9);
                     border: 1px solid var(--linie); color: var(--text);
                     border-radius: 15px; padding: 6px 12px;
                     font: inherit; font-size: 12px; cursor: pointer;
                     white-space: nowrap; min-height: 32px; }
  .tagchips button.aktiv { background: var(--akzent); color: #10130f;
                           border-color: var(--akzent);
                           font-weight: 600; }

  #kontoleiste { display: none !important; }

  body.hell .pille, body.hell .tagchips button {
    background: rgba(255,255,255,.94); }

  /* ===== Knopfsaeule rechts ===== */
  .saeule { position: absolute; right: 10px; top: 312px;
            display: flex; flex-direction: column; gap: 7px;
            z-index: 6; }

  /* Die eingebauten Knoepfe von MapLibre - Zoom, Standort,
     Routenaufzeichnung - lagen unter der Pille und waren auf dem
     Telefon nicht erreichbar. Sie kommen in dieselbe Saeule und
     bekommen dasselbe Aussehen. */
  .maplibregl-ctrl-top-right { top: 152px !important;
                               right: 0 !important; }
  .maplibregl-ctrl-top-right .maplibregl-ctrl {
    margin: 0 10px 7px 0 !important; background: none !important;
    box-shadow: none !important; }
  .maplibregl-ctrl-top-right button {
    width: 40px !important; height: 40px !important;
    border-radius: 20px !important;
    background: rgba(30,34,40,.94) !important;
    border: 1px solid var(--linie) !important;
    margin-bottom: 7px !important; }
  .maplibregl-ctrl-top-right button + button { border-top: 1px solid
    var(--linie) !important; }
  .maplibregl-ctrl-top-right button span {
    filter: invert(1) brightness(1.4); }
  body.hell .maplibregl-ctrl-top-right button {
    background: rgba(255,255,255,.94) !important; }
  body.hell .maplibregl-ctrl-top-right button span { filter: none; }
  .rund { width: 40px; height: 40px; border-radius: 20px;
          background: rgba(30,34,40,.94); border: 1px solid var(--linie);
          color: var(--text); display: flex; align-items: center;
          justify-content: center; font-size: 16px; cursor: pointer;
          text-decoration: none; }
  .rund:hover { border-color: var(--akzent); color: var(--akzent); }
  .rund.aktiv { border-color: var(--akzent); color: var(--akzent);
                background: rgba(95,183,99,.14); }
  body.hell .rund { background: rgba(255,255,255,.94); }

  /* Auf dem Telefon ist der Block NUR im Blatt zu sehen.
     Beide Regeln haben dieselbe Genauigkeit - die zweite gewinnt,
     weil sie spaeter steht. Deshalb muessen sie in dieser
     Reihenfolge und moeglichst weit unten stehen. */
  @media (max-width: 700px) {
    header #einstellungen { display: none; }
    .blatt-inhalt #einstellungen { display: block; }

    /* Auf dem Telefon zoomt man mit zwei Fingern - die Knoepfe
       nehmen nur Platz weg und ruecken alles andere nach unten. */
    .maplibregl-ctrl-zoom-in,
    .maplibregl-ctrl-zoom-out { display: none !important; }
    .saeule { top: 210px; }
  }

  /* ===== Bestenliste =====
     Dort bleibt nur die Tagesauswahl. Sie rueckt nach oben, weil
     Pille und Einstellungen wegfallen - sonst klaffte eine Luecke
     und der erste Eintrag der Liste verschwaende darunter. */
  body.inliste .pille,
  body.inliste #einstellungen,
  body.inliste .saeule { display: none !important; }
  body.inliste .tagchips { top: 10px; }
  body.inliste #liste { padding-top: 58px; }

  /* ===== Reiterleiste unten =====
     Am unteren Rand, weil man dort mit dem Daumen hinkommt. Reiter
     oben sind auf dem Telefon nur mit Umgreifen erreichbar. */
  .reiter { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
            display: flex; background: var(--flaeche);
            border-top: 1px solid var(--linie);
            padding-bottom: env(safe-area-inset-bottom); }
  .reiter button { flex: 1; display: flex; flex-direction: column;
                   align-items: center; justify-content: center;
                   gap: 2px; background: transparent; border: 0;
                   color: var(--leise); font: inherit; font-size: 10px;
                   padding: 7px 4px 8px; cursor: pointer;
                   min-height: 52px; }
  .reiter button.an { color: var(--akzent); }
  .reiter button[hidden] { display: none; }
  .reiter i { font-style: normal; font-size: 17px; line-height: 1; }
  .reiter span { white-space: nowrap; overflow: hidden;
                 text-overflow: ellipsis; max-width: 100%; }
  body.hell .reiter { background: #ffffff; }

  /* Alles Schwebende muss ueber der Leiste bleiben */

  .fuss { bottom: 52px !important; }
  .blatt-huelle .blatt-inhalt { margin-bottom: 52px; }

  /* ===== Blatt von unten ===== */
  .blatt-huelle { position: fixed; inset: 0; z-index: 30;
                  background: rgba(0,0,0,.5); display: flex;
                  align-items: flex-end; justify-content: center; }
  .blatt-huelle[hidden] { display: none; }
  .blatt-inhalt { background: var(--flaeche); width: 100%;
                  max-width: 520px; border-radius: 16px 16px 0 0;
                  padding: 8px 16px 20px; max-height: 78vh;
                  overflow-y: auto; overscroll-behavior: contain; }
  .griff { width: 36px; height: 4px; background: var(--linie);
           border-radius: 2px; margin: 0 auto 12px; }

  /* Auf dem Telefon ist nicht ersichtlich, wie man das Blatt wieder
     schliesst - der Griff allein reicht als Hinweis nicht. */
  .blatt-inhalt { position: relative; }
  .blattzu { position: absolute; right: 10px; top: 6px;
             background: transparent; border: 0; color: var(--leise);
             font-size: 26px; line-height: 1; cursor: pointer;
             padding: 4px 10px; }
  .blattzu:hover { color: var(--akzent); }
  .blatt-inhalt h3 { margin: 0 0 4px; font-size: 16px; }
  .blatt-inhalt .klein { color: var(--leise); font-size: 12px;
                         margin-bottom: 10px; }

  .artenliste { display: flex; flex-direction: column; gap: 2px; }
  .artzeile { display: flex; align-items: center; width: 100%;
              border-radius: 8px;
              border-bottom: 1px solid var(--linie); }
  .artname { display: flex; align-items: center; flex: 1;
             background: transparent; border: 0; color: var(--text);
             padding: 12px 10px 12px 4px; cursor: pointer;
             font: inherit; font-size: 14px; text-align: left; }
  .stern { background: transparent; border: 0; cursor: pointer;
           color: var(--leise); font-size: 17px; line-height: 1;
           padding: 10px 6px 10px 8px; }
  .stern.an { color: #e8c34a; }
  #liste h2 .stern { font-size: 15px; padding: 0 6px 0 0;
                     vertical-align: baseline; }
  .stern:hover { color: #e8c34a; }
  .artzeile:last-child { border-bottom: 0; }
  .artname b { margin-left: auto; color: var(--akzent);
               font-size: 16px; }
  .artzeile.aktiv { background: rgba(95,183,99,.12); }
  .artzeile:hover { background: rgba(255,255,255,.05); }

  body.hell .blatt-inhalt { background: #ffffff; }

  /* Auf dem Telefon ist die Breite knapp - dort wuerde der
     Einstellungsblock die Legende doch verdecken. Deshalb rueckt
     die Legende dann nach oben. */
  @media (max-width: 700px) {
    .pille { padding: 9px 13px; }
    .pille b { font-size: 13.5px; }
    .tagchips { top: 56px; }
    #kontoleiste { top: 98px; }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  html { height: 100%; }
  body { font: 15px/1.45 system-ui, -apple-system, sans-serif;
         background: var(--grund); color: var(--text);
         /* Bezugspunkt fuer alles, was darueber schwebt */
         position: relative; height: 100vh; height: 100dvh;
         overflow: hidden;
         -webkit-text-size-adjust: 100%; }

  /* Die alte Kopfzeilenregel stand hier und hat die neue weiter
     oben ueberschrieben - mit Hintergrund und ohne "absolute".
     Dadurch belegte der Kopfbereich weiterhin Platz, und fuer die
     Karte blieben nur 229 Pixel. */
  .kopfzeile { display: flex; align-items: center; gap: 8px;
               flex-wrap: wrap; margin-bottom: 7px; }
  .kopfzeile .umschalter { flex: 0 1 auto; min-width: 0; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  /* Der Stand gehoert auf die Karte, nicht in die Kopfzeile -
     dort ist der Platz knapp, und hier stoert er nicht. */
  /* Der Stand lag unter der Pille und wurde von ihr verdeckt.
     Rechts oben, unterhalb der Zoomknoepfe, stoert er nichts. */
  .stand { position: absolute; top: 106px; right: 10px; z-index: 3;
           left: auto;
           font-size: 10.5px; color: var(--leise);
           background: rgba(21,24,28,.75); padding: 2px 6px;
           border-radius: 4px; pointer-events: none; }

  /* Konto oben rechts, nicht im Einstellungsmenue - man will
     sehen, ob man angemeldet ist, ohne erst aufzuklappen. */
  /* Konto als EIN Knopf. Alles Weitere steht im Menue dahinter -
     sonst platzt die Kopfzeile auf dem Telefon. */
  #kontoleiste { display: flex; gap: 4px; flex: 0 0 auto;
                 margin-left: auto; }
  /* Ohne diese Zeile gewinnt display:flex gegen das
     hidden-Merkmal, und die leere Leiste bleibt stehen. */
  #kontoleiste[hidden] { display: none; }
  #kontoleiste .tag { padding: 5px 11px; font-size: 12px;
                      min-height: 30px; border-radius: 15px; }
  #kontoleiste .tag.an { border-color: var(--akzent);
                         color: var(--akzent); }
  .veraltet { color: #e8a33d; font-weight: 600; }

  .ansicht { display: flex; gap: 3px; margin-left: 10px; }
  .um { border: 1px solid var(--linie); background: transparent;
        color: var(--leise); padding: 4px 10px; cursor: pointer;
        font-size: 12px; border-radius: 5px; min-height: 30px; }
  .um.aktiv { background: var(--linie); color: var(--text); }
  a.um { text-decoration: none; display: flex; align-items: center;
         justify-content: center; min-width: 32px; }

  #liste { position: absolute; inset: 0; z-index: 4;
           background: var(--grund); overflow-y: auto;
           padding: 104px 12px 64px 12px 60px;
           -webkit-overflow-scrolling: touch; }
  #liste h2 { font-size: 15px; margin: 20px 0 6px;
              border-bottom: 1px solid var(--linie); padding-bottom: 4px;
              display: flex; align-items: baseline; }
  #liste h2:first-child { margin-top: 0; }
  #liste h2 .saison { margin-left: auto; font-weight: 400; font-size: 12px;
                      color: var(--leise); }
  #liste table { width: 100%; border-collapse: collapse; }
  #liste td { padding: 7px 5px; border-bottom: 1px solid var(--linie);
              vertical-align: top; }
  #liste td.rang { width: 24px; color: var(--leise);
                   font-variant-numeric: tabular-nums; }
  #liste td.wert { text-align: right; width: 46px; font-size: 18px;
                   font-weight: 700; font-variant-numeric: tabular-nums; }
  #liste td.hin { width: 62px; text-align: right; }
  #liste .klein { font-size: 11px; color: var(--leise); }
  #liste button.hin { border: 1px solid var(--linie); background: transparent;
                      color: var(--akzent); padding: 5px 9px;
                      border-radius: 5px; cursor: pointer; font-size: 12px;
                      min-height: 32px; white-space: nowrap; }
  #liste .leer { color: var(--leise); font-size: 13px; padding: 8px 0; }
  #liste details { margin: 0 0 4px; }
  #liste summary { cursor: pointer; color: var(--akzent); font-size: 13px;
                   padding: 8px 5px; list-style: none; }
  #liste summary::-webkit-details-marker { display: none; }
  #liste summary::before { content: "▸ "; }
  #liste details[open] summary::before { content: "▾ "; }

  /* Pfeile links und rechts der Artenleiste - am Rechner der
     bequemere Weg, am Telefon wischt man. */
  .artenzeile { display: flex; align-items: center; gap: 6px; }
  .artenzeile .leiste { flex: 0 1 auto; min-width: 0; }

  /* Nur die drei aussichtsreichsten Arten stehen als Knopf da, der
     Rest im Ausklappmenue. Bei elf Arten war die Leiste sonst
     laenger als der Bildschirm. */
  .art.versteckt { display: none; }
  #artwahl { flex: 1 1 auto; min-width: 90px; max-width: 190px;
             background: var(--grund); color: var(--text);
             border: 1px solid var(--linie); border-radius: 20px;
             padding: 8px 10px; font: inherit; font-size: 13px;
             min-height: 38px; cursor: pointer; }
  @media (max-width: 700px) {
    .artenzeile .pfeilknopf { display: none; }
  }

  .leiste { display: flex; gap: 6px; overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--linie) transparent;
            padding-bottom: 3px; }
  @media (max-width: 700px) { .leiste { scrollbar-width: none; } }
  /* Am Rechner eine schmale Bildlaufleiste zeigen - sonst sieht
     man nicht, dass es weitergeht, und das Mausrad scrollt
     senkrecht statt waagerecht. Auf dem Telefon wischt man
     ohnehin. */
  .leiste::-webkit-scrollbar { height: 6px; }
  .leiste::-webkit-scrollbar-thumb { background: var(--linie);
                                     border-radius: 3px; }
  .leiste::-webkit-scrollbar-track { background: transparent; }
  @media (max-width: 700px) {
    .leiste::-webkit-scrollbar { display: none; }
  }
  .art { flex: 0 0 auto; border: 1px solid var(--linie);
         background: var(--grund); color: var(--text);
         padding: 7px 12px; border-radius: 20px; cursor: pointer;
         font-size: 13px; min-height: 38px; white-space: nowrap;
         display: flex; align-items: baseline; gap: 5px; }
  .art .wert { font-size: 10px; opacity: .6; }
  .art .wert b { font-size: 14px; opacity: 1; }
  .art.aktiv { background: var(--akzent); border-color: var(--akzent);
               color: #10130f; }
  .art.aktiv .wert { opacity: .75; }

  .regler { display: flex; align-items: center; gap: 10px;
            margin-top: 8px; }
  .regler input[type=range] { flex: 1; min-width: 0; height: 26px;
                              accent-color: var(--akzent);
                              cursor: pointer; }
  /* Pfeile nur am Rechner - auf dem Telefon ist der Regler mit dem
     Finger schneller und der Platz knapp. */
  .pfeilknopf { flex: 0 0 auto; border: 1px solid var(--linie);
                background: transparent; color: var(--text);
                width: 30px; height: 30px; border-radius: 6px;
                cursor: pointer; font-size: 11px; line-height: 1;
                padding: 0; }
  .pfeilknopf:hover { border-color: var(--akzent);
                      color: var(--akzent); }
  .pfeilknopf:disabled { opacity: .3; cursor: default;
                         border-color: var(--linie); color: var(--text); }
  @media (max-width: 700px) { .pfeilknopf { display: none; } }

  .regler #tagname { flex: 0 0 auto; font-size: 13px; font-weight: 600;
                     color: var(--akzent); min-width: 74px;
                     text-align: right; }
  .regler .marke { flex: 0 0 62px; font-size: 11px;
                   color: var(--leise); }
  .regler #deckwert { flex: 0 0 auto; font-size: 12px;
                      color: var(--leise); min-width: 74px;
                      text-align: right; }

  /* Alle Einstellungszeilen gleich aufgebaut: Ueberbegriff links in
     fester Breite, danach die Knoepfe - so beginnen sie in einer
     Spalte. */
  .zeile { display: flex; align-items: center; gap: 10px;
           margin-top: 6px; }
  .zeile > .marke { flex: 0 0 62px; font-size: 11px;
                    color: var(--leise); }
  .zeile .tagleiste { margin-top: 0; flex: 1; min-width: 0; }

  /* Hell/dunkel gehoert nicht ins Ausklappmenue - man will es
     umschalten koennen, ohne erst aufzuklappen. */
  .mehrzeile { display: flex; align-items: center; }
  .mehrzeile .mehr { flex: 1; }
  .hellknopf { flex: 0 0 auto; border: 1px solid var(--linie);
               background: transparent; color: var(--leise);
               width: 34px; height: 34px; border-radius: 17px;
               cursor: pointer; font-size: 15px; line-height: 1;
               padding: 0; }
  .hellknopf:hover { border-color: var(--akzent);
                     color: var(--akzent); }

  .mehr { margin-top: 7px; background: transparent; border: 0;
          color: var(--leise); font-size: 12px; cursor: pointer;
          padding: 5px 0; display: flex; align-items: center;
          gap: 6px; min-height: 32px; }
  .mehr .pfeil { display: inline-block; transition: transform .18s; }
  .mehr.offen .pfeil { transform: rotate(180deg); }
  .mehr.offen { color: var(--akzent); }
