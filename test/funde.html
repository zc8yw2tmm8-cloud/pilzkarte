<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mehrere Funde – lokaler Test</title>
<link rel="stylesheet" href="../web/konto.css">
<style>:root{--linie:#d5ddd5;--akzent:#34734c;--papier:#fff;--text:#24362b}*{box-sizing:border-box}body{font:16px system-ui;background:#eef3ee;padding:24px}button{padding:10px;cursor:pointer}.kasten-inhalt{background:white}.voll{display:block;width:100%;padding:12px;margin-top:8px;background:#34734c;color:white;border:1px solid #34734c;border-radius:8px}.leer{background:white;color:#34734c}.klein{font-size:14px}.fehler{color:#a22}.tag{border:1px solid #ccc;border-radius:14px;background:white}.tag.aktiv{border-color:#34734c;color:#34734c;font-weight:600}</style>
<h1>Mehrere Funde testen</h1>
<p>Nur Testdaten: Es besteht keine Verbindung zum Backend. Speichern verändert keine echten Funde.</p>
<button onclick="fundBeginnen(52.4,10.7,'test')">Neuen Fund testen</button>
<button onclick="fundBearbeiten('11111111-1111-4111-8111-111111111111')">Bearbeiten testen</button>
<button onclick="routeUmschalten()">Pilzsuche starten testen</button>
<button onclick="tests()">Automatische Tests ausführen</button>
<pre id="ergebnis" role="status"></pre>
<script src="../web/konto.js"></script>
<script>
const D={stand:fundHeute(),arten:{stein:{name:'Steinpilz'},pfiff:{name:'Pfifferling'}},tage:[{datum:fundHeute()}],zellen:[{id:'test',lat:52.4,lon:10.7,scores:{stein:[80],pfiff:[0]}}]};
let art='stein', requests=[], fail=false, failTable=null, pending=null, gestartet=null;
var karte={getCenter:()=>({lat:52.4,lng:10.7}),getLayer:()=>null,getSource:()=>null,removeLayer(){},removeSource(){}};
const ROUTE_ID='33333333-3333-4333-8333-333333333333';const OFFEN='pilzkarte_suchgang_offen';confirm=()=>true;
const original={id:'11111111-1111-4111-8111-111111111111',art:'stein',gefunden_am:fundHeute(),anzahl:2,notiz:'Vorhandene Notiz',nullfund:false,lat:52.4,lon:10.7,zelle:'test',score:63};
benutzer={id:'22222222-2222-4222-8222-222222222222'};
const fehlerFuer=table=>(fail||failTable===table)?{message:'Test-Verbindungsfehler'}:null;
sb={from(table){if(!['fund','suchgang','route'].includes(table))throw Error('Unerwartete Tabelle');return {
 upsert(rows,options){requests.push({table,rows:structuredClone(rows),options});return pending||Promise.resolve({error:fehlerFuer(table)});},
 insert(row){requests.push({table,rows:structuredClone(row),options:null});return {select(){return {single(){return Promise.resolve({data:{id:ROUTE_ID},error:fehlerFuer(table)})}}}}},
 update(row){requests.push({table,rows:structuredClone(row),options:'update'});return this},
 delete(){requests.push({table,rows:null,options:'delete'});return this},
 select(){return this},eq(){return this},single(){return Promise.resolve({data:structuredClone(original),error:null})}
}}};
melde=text=>{document.getElementById('ergebnis').textContent=text};
ladeEigeneFunde=async()=>{};
ladeRouten=async()=>{};
zeigeTagebuch=()=>kastenZu();
routeBeginnen=sg=>{gestartet=sg||'nur Route';return true};
const check=(value,message)=>{if(!value)throw Error(message)};
const click=id=>document.getElementById(id).click();
const warte=(ms=20)=>new Promise(r=>setTimeout(r,ms));
function neu(){fundFormular=null;requests=[];fail=false;failTable=null;pending=null;fundBeginnen(52.4,10.7,'test')}
function zweite(){click('fund-plus');let z=fundFormular.zeilen[1];z.auswahl.value='pfiff';z.auswahl.dispatchEvent(new Event('change'));return z}
async function tests(){
 const result=[];
 async function test(name,fn){try{await fn();result.push('OK: '+name)}catch(e){result.push('FEHLER: '+name+' – '+e.message)}finally{aufzeichnung=null;failTable=null;fundFormular=null;suchgangEnde=null;suchgangOffenGefragt=false;localStorage.removeItem(OFFEN)}}
 await test('Plus, Minus und Nummerierung',async()=>{neu();zweite();click('fund-plus');check(fundFormular.zeilen.length===3,'drei Zeilen');fundFormular.zeilen[1].el.querySelector('button').click();check(fundFormular.zeilen.length===2,'entfernt');check(fundFormular.zeilen[1].el.querySelector('legend').textContent==='Fund 2','Nummerierung');check(fundFormular.zeilen[0].el.querySelector('button').hidden,'erster Fund bleibt')});
 await test('Zwei Arten, eigene Mengen und Scores, ein Request',async()=>{neu();fundFormular.zeilen[0].anzahl.value='3';zweite().anzahl.value='7';document.getElementById('fundnotiz').value='Gemeinsame Notiz';await fundSpeichern();const r=requests[0].rows;check(requests.length===1&&r.length===2,'Sammelrequest');check(r[0].anzahl===3&&r[1].anzahl===7,'Mengen');check(r[0].score===80&&r[1].score===0,'Scores einschließlich Null');check(r[0].id!==r[1].id,'eigene IDs');check(r.every(e=>e.notiz==='Gemeinsame Notiz'&&e.ort==='POINT(10.7 52.4)'),'gemeinsame Angaben')});
 await test('Fehlende Auswahl, ungültige Menge und Datum blockieren Speichern',async()=>{neu();click('fund-plus');await fundSpeichern();check(requests.length===0,'Auswahl');fundFormular.zeilen[1].auswahl.value='pfiff';fundFormular.zeilen[0].anzahl.value='1.5';await fundSpeichern();check(requests.length===0,'ganze Menge');fundFormular.zeilen[0].anzahl.value='';document.getElementById('funddatum').value='';await fundSpeichern();check(requests.length===0,'Datum')});
 await test('Eigene Namen sind Text; historischer Score bleibt unbekannt',async()=>{neu();const z=fundFormular.zeilen[0];z.auswahl.value='__eigene';z.auswahl.dispatchEvent(new Event('change'));z.eigene.value='<img src=x onerror=alert(1)>';document.getElementById('funddatum').value='2020-01-01';await fundSpeichern();check(requests[0].rows[0].score===null,'kein erfundener Score');check(!document.querySelector('#kasten img'),'kein HTML aus Name')});
 await test('Bearbeiten erhält ID und ursprünglichen Score, fügt neuen Fund hinzu',async()=>{neu();await fundBearbeiten(original.id);zweite();await fundSpeichern();const r=requests[0].rows;check(r[0].id===original.id&&r[0].score===63,'bestehender Fund');check(r[1].id!==original.id&&r[1].score===0,'neuer Fund');check(!('suchgang' in r[0]),'Zuordnung bleibt unberührt')});
 await test('Artwechsel beim Bearbeiten berechnet passenden Score',async()=>{neu();await fundBearbeiten(original.id);fundFormular.zeilen[0].auswahl.value='pfiff';await fundSpeichern();check(requests[0].rows[0].score===0,'neuer Score')});
 await test('Nullfund je Zeile und für alle',async()=>{neu();zweite().nullfund.checked=true;await fundSpeichern();check(!requests[0].rows[0].nullfund&&requests[0].rows[1].nullfund,'einzelner Nullfund');neu();zweite();await fundSpeichern(true);check(requests[0].rows.every(r=>r.nullfund&&r.anzahl===null),'alle Nullfunde')});
 await test('Fehler bewahrt Eingaben und IDs für Wiederholung',async()=>{neu();zweite();fail=true;await fundSpeichern();check(!document.getElementById('fundfehler').hidden&&fundFormular.zeilen.length===2,'Form erhalten');check(!document.getElementById('fund-speichern').disabled,'erneut möglich');fail=false;await fundSpeichern();check(requests[0].rows.every((r,i)=>r.id===requests[1].rows[i].id),'IDs stabil')});
 await test('Doppelklick und Schließen während Speichern gesperrt',async()=>{neu();let resolve;pending=new Promise(r=>resolve=r);const save=fundSpeichern();await fundSpeichern();kastenZu();check(requests.length===1,'nur ein Request');check(!document.getElementById('kasten').hidden,'bleibt offen');resolve({error:null});await save;pending=null});
 await test('Pilzsuche starten: Arten vorher wählen, Einwilligung je Gang',async()=>{kastenZu();requests=[];gestartet=null;localStorage.setItem('pilzkarte_suche_auswertung','0');routeUmschalten();const stein=document.querySelector('[data-sucheart="stein"]');check(stein.classList.contains('aktiv'),'aktuelle Art vorgewählt');check(!document.getElementById('suche-auswertung').checked,'Voreinstellung aus');stein.click();click('suche-start');check(!gestartet&&!document.getElementById('suche-fehler').hidden,'ohne Art kein Start');document.querySelector('[data-sucheart="pfiff"]').click();document.getElementById('suche-auswertung').checked=true;click('suche-start');await gestartet.versionBereit;await warte();const s=requests.filter(r=>r.table==='suchgang');check(gestartet.arten.join()==='pfiff'&&gestartet.auswertung_erlaubt&&gestartet.einwilligung_version&&gestartet.einwilligung_zeit,'Arten und Einwilligung');check(localStorage.getItem('pilzkarte_suche_auswertung')==='1','Voreinstellung gemerkt');const z=s[0]&&s[0].rows;check(s.length===1&&z.id===gestartet.id&&z.ergebnisse.pfiff==='offen'&&!('ergebnis' in z),'sofort gesichert, Art offen');check(/^[0-9a-f]{12}$/.test(z.config_hash)&&z.modellversion===null&&z.versionsstatus==='legacy','Hash statt Modellversion');routeUmschalten();click('suche-nur-route');check(gestartet==='nur Route','nur Route ohne Suchgang')});
 await test('Fund während der Pilzsuche: verknüpft, Art gefunden, lokal gesichert',async()=>{const sg=suchgangNeu({arten:['stein','pfiff']});aufzeichnung={suchgang:sg,beginn:new Date(),punkte:[],km:0};neu();check(document.querySelector('#kasten .kasten-inhalt').textContent.includes('Suchgang'),'Hinweis');await fundSpeichern();await warte();check(requests[0].table==='suchgang'&&requests[1].table==='fund','Suchgang vor Fund');check(requests[1].rows[0].suchgang===sg.id&&sg.funde.stein===1,'verknüpft und gezählt');check(sg.ergebnisse.stein==='fund'&&sg.ergebnisse.pfiff==='offen','nur gefundene Art');const letzte=requests.filter(r=>r.table==='suchgang').at(-1).rows;check(letzte.ergebnisse.stein==='fund','Ergebnis gesichert');check(JSON.parse(localStorage.getItem(OFFEN)).suchgang.id===sg.id,'auf dem Gerät')});
 await test('Ohne gespeicherten Suchgang wird kein Fund übertragen',async()=>{const sg=suchgangNeu({arten:['stein']});aufzeichnung={suchgang:sg,beginn:new Date(),punkte:[],km:0};neu();failTable='suchgang';await fundSpeichern();check(!requests.some(r=>r.table==='fund'),'kein Fund ohne Suchgang');check(!document.getElementById('fundfehler').hidden,'Fehler sichtbar')});
 await test('Ergebnis je Art: Nullfund nur verneint, Suchdauer, Route einmal',async()=>{kastenZu();requests=[];const beginn=new Date(Date.now()-3600000);const sg=suchgangNeu({arten:['stein','pfiff'],beginn});suchgangOrt(sg,52.4,10.7,8);suchgangEndeDialog({suchgang:sg,beginn,km:2.3,punkte:[{lat:52.4,lon:10.7,t:0},{lat:52.41,lon:10.71,t:60},{lat:52.42,lon:10.72,t:120}]});check(document.querySelectorAll('#kasten input[data-ergebnis][value="offen"]:checked').length===2,'alle Arten offen vorbelegt');check(!document.getElementById('suche-verwerfen'),'mit Weg nicht verwerfbar');document.querySelector('input[data-ergebnis="stein"][value="nullfund"]').checked=true;document.getElementById('suche-dauer').value='999';await warte();const vorher=requests.length;click('suche-fertig');await warte();check(!document.getElementById('suche-fehler').hidden&&requests.length===vorher,'Suchdauer über Wegdauer abgelehnt');document.getElementById('suche-dauer').value='45';failTable='suchgang';await suchgangAbschliessen(suchgangEnde);check(!document.getElementById('suche-fehler').hidden,'Fehler sichtbar');check(JSON.parse(localStorage.getItem(OFFEN)).routeId===ROUTE_ID,'Route lokal vermerkt');failTable=null;await suchgangAbschliessen(suchgangEnde);const t=n=>requests.filter(r=>r.table===n);check(t('route').length===1,'Route genau einmal');const letzte=t('suchgang').at(-1).rows;check(letzte.ergebnisse.stein==='nullfund'&&letzte.ergebnisse.pfiff==='offen','Ergebnisse je Art');check(letzte.suchdauer_min===45&&letzte.route===ROUTE_ID&&letzte.ende,'Suchgang abgeschlossen');const f=t('fund');check(f.length===1&&f[0].rows.length===1&&f[0].rows[0].art==='stein'&&f[0].rows[0].nullfund&&f[0].rows[0].suchgang===sg.id,'Nullfund nur für verneinte Art');check(f[0].rows[0].score===80,'Startwert');check(document.getElementById('kasten').hidden&&!localStorage.getItem(OFFEN),'Dialog zu, Gerät aufgeräumt')});
 await test('Gefunden ohne Eintrag: Fundformular je Art, ohne Route',async()=>{kastenZu();requests=[];const sg=suchgangNeu({arten:['stein','pfiff']});suchgangOrt(sg,52.4,10.7,8);suchgangEndeDialog({suchgang:sg,beginn:new Date(),km:0.1,punkte:[]});check(document.getElementById('kasten').textContent.includes('Zu wenige Punkte'),'Hinweis ohne Route');document.querySelectorAll('#kasten input[data-ergebnis][value="fund"]').forEach(i=>i.checked=true);await suchgangAbschliessen(suchgangEnde);check(fundFormular&&fundFormular.ort.suchgang===sg,'Fundformular verknüpft');check(fundFormular.zeilen.map(z=>z.auswahl.value).join()==='stein,pfiff','eine Zeile je Art');check(!requests.some(r=>r.table==='route'||r.table==='fund'),'keine Route, kein Nullfund')});
 await test('Leeren Suchgang verwerfen',async()=>{kastenZu();requests=[];const sg=suchgangNeu({arten:['stein']});suchgangEndeDialog({suchgang:sg,beginn:new Date(),km:0,punkte:[]});click('suche-verwerfen');await warte();check(requests.some(r=>r.table==='suchgang'&&r.options==='delete'),'gelöscht');check(document.getElementById('kasten').hidden&&!suchgangEnde,'Dialog zu')});
 await test('Nachtrag: nur Datum, keine Kartenwerte, Ergebnis je Art',async()=>{kastenZu();requests=[];suchgangNachtragen();document.getElementById('suche-dauer').value='0';click('suche-speichern');await warte();check(!requests.length&&!document.getElementById('suche-fehler').hidden,'Suchdauer 0 abgelehnt');document.getElementById('suche-dauer').value='';document.querySelector('[data-sucheart="pfiff"]').click();document.querySelector('input[data-ergebnis="stein"][value="nullfund"]').checked=true;document.querySelector('input[data-ergebnis="pfiff"][value="fund"]').checked=true;const stein=document.querySelector('[data-sucheart="stein"]');stein.click();stein.click();check(document.querySelector('input[data-ergebnis="stein"][value="nullfund"]').checked,'Auswahl bleibt beim Umschalten');click('suche-speichern');await warte(80);const s=requests.filter(r=>r.table==='suchgang');check(s.length===1,'gespeichert');const r=s[0].rows;check(r.quelle==='nachtrag'&&r.datum===fundHeute()&&r.beginn===null&&r.ende===null&&r.suchdauer_min===null,'nur Datum, Dauer unbekannt');check(r.angezeigt===null&&r.datenstand===null&&r.config_hash===null,'keine Kartenwerte');check(r.lat===52.4&&r.lon===10.7&&r.zelle==='test','Ort aus Kartenmitte');const f=requests.filter(q=>q.table==='fund');check(f.length===1&&f[0].rows.length===1&&f[0].rows[0].art==='stein'&&f[0].rows[0].score===null,'Nullfund ohne Score');check(fundFormular&&fundFormular.zeilen.length===1&&fundFormular.zeilen[0].auswahl.value==='pfiff','Fundformular für gefundene Art');await fundSpeichern();const neu=requests.filter(q=>q.table==='fund').at(-1).rows[0];check(neu.art==='pfiff'&&neu.score===null&&neu.suchgang===r.id,'Fund ohne Score, verknüpft')});
 await test('Widerruf sperrt gespeicherte und offene Gänge',async()=>{kastenZu();requests=[];localStorage.setItem('pilzkarte_suche_auswertung','1');const sg=suchgangNeu({arten:['stein'],einwilligung:true});aufzeichnung={suchgang:sg,beginn:new Date(),punkte:[],km:0};suchgangMerken(aufzeichnung);await suchgangAuswertungWiderrufen();const u=requests.find(r=>r.options==='update');check(u&&u.table==='suchgang'&&u.rows.auswertung_erlaubt===false&&Object.keys(u.rows).length===1,'alle eigenen Gänge');check(!sg.auswertung_erlaubt,'laufender Gang');check(JSON.parse(localStorage.getItem(OFFEN)).suchgang.auswertung_erlaubt===false,'Stand auf dem Gerät');check(localStorage.getItem('pilzkarte_suche_auswertung')==='0','Voreinstellung aus')});
 await test('Nicht abgeschlossener Gang: fortsetzen oder offen lassen',async()=>{kastenZu();requests=[];gestartet=null;const sg=suchgangNeu({arten:['stein']});suchgangOrt(sg,52.4,10.7,8);const punkte=[{lat:52.4,lon:10.7,t:0},{lat:52.41,lon:10.71,t:60}];suchgangMerken({suchgang:sg,beginn:new Date(sg.beginn),punkte,km:1.2});suchgangOffenPruefen();check(document.getElementById('kasten').textContent.includes('nicht abgeschlossen'),'Dialog');click('suche-weiter');check(gestartet&&gestartet.id===sg.id&&gestartet.ende===null,'derselbe Gang läuft weiter');suchgangOffenGefragt=false;suchgangOffenPruefen();click('suche-spaeter');await warte();const r=requests.filter(q=>q.table==='suchgang').at(-1).rows;check(r.id===sg.id&&r.ende&&r.ergebnisse.stein==='offen','offen gespeichert');check(!localStorage.getItem(OFFEN),'Gerät aufgeräumt');localStorage.setItem(OFFEN,JSON.stringify({benutzer:'fremd',suchgang:{id:'x'}}));suchgangOffenGefragt=false;kastenZu();suchgangOffenPruefen();check(document.getElementById('kasten').hidden,'fremder Stand wird nicht angeboten')});
 kastenZu();document.getElementById('ergebnis').textContent=result.join('\n');
}
</script></html>
